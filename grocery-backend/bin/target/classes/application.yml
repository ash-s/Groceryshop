spring:
  application:
    name: grocery-shop-backend

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/grocery_shop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:grocery-shop-super-secret-key-please-change-in-production-1234567890}
    expiration-ms: ${JWT_EXPIRATION:86400000}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

whatsapp:
  owner-phone: ${OWNER_WHATSAPP:+919876543210}
  enabled: ${WHATSAPP_ENABLED:false}

logging:
  level:
    org.hibernate.SQL: WARN
    com.groceryshop: DEBUG
