spring:
  application:
    name: grocery-shop-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/grocery_shop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Admin@123}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:grocery-shop-super-secret-key-please-change-in-production-1234567890}
    expiration-ms: ${JWT_EXPIRATION:86400000}

  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:grocery.shop.no.reply@gmail.com}

  reset-url: ${APP_RESET_URL:http://localhost:5173/reset-password}

  upload-dir: ${UPLOAD_DIR:uploads}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

whatsapp:
  owner-phone: ${OWNER_WHATSAPP:+919876543210}
  enabled: ${WHATSAPP_ENABLED:false}
  meta-enabled: ${WHATSAPP_META_ENABLED:false}
  meta-token: ${WHATSAPP_META_TOKEN:}
  meta-phone-number-id: ${WHATSAPP_META_PHONE_NUMBER_ID:}
  meta-template-name: ${WHATSAPP_META_TEMPLATE:grocery_shop_restock_alert}
  meta-api-version: ${WHATSAPP_META_API_VERSION:v21.0}

logging:
  level:
    org.hibernate.SQL: WARN
    com.groceryshop: DEBUG
